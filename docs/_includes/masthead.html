{% assign site_logo = site.logo | relative_url %}

<header id="masthead">
  <div class="inner">
    <div class="title-area">
      <h1 class="site-title">
        <a href="{{ '/' | relative_url }}">
          {% if site.logo %}
            <img src="{{ site_logo }}" alt="" class="site-logo">
          {% endif %}
          <span style="font-size: 1.5em; margin-left: 0;">{{ site.title | escape }}</span>
        </a>
      </h1>
      <h3 class="site-description" style="white-space: nowrap; margin-left: 8em; margin-top: -1em; font-weight: normal; font-style: italic;">
        {{ site.description }}
      </h3>
    </div>
  </div>
</header>
